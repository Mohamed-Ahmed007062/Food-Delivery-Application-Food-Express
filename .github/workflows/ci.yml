name: FoodExpress CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: TypeScript Build Check
        run: |
          cd server
          npm run build

      - name: Execute Backend Unit Test Suite (27 Tests)
        run: |
          cd server
          npx tsx --test tests/marketplace_unit.test.ts

  frontend-ci:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Vite Production Build Check
        run: |
          cd client
          npm run build
