version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: foodexpress-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: food_delivery_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - foodexpress-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Node.js Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: foodexpress-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/food_delivery_db
      JWT_SECRET: super_secure_jwt_access_secret_production_2026
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_secure_jwt_refresh_secret_production_2026
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost
      STRIPE_SECRET_KEY: sk_test_mock_key_production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - foodexpress-network

  # React Vite Frontend Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: foodexpress-client
    restart: always
    environment:
      VITE_API_URL: http://localhost/api/v1
    networks:
      - foodexpress-network

  # Nginx Gateway Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: foodexpress-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client
    networks:
      - foodexpress-network

networks:
  foodexpress-network:
    driver: bridge

volumes:
  mongodb_data:
